name: Design
summary: >-
  The planners and creators of the robot's blueprint. Using CAD software and creative
  thinking, Design turns ideas into precise 3D models that guide the build. As soon as the
  season's game is unveiled, Design is off to the races to design a robot that fits the goals
  of our strategy committee, then works with Mechanics to build the frame and mechanisms. If
  you enjoy engineering challenges, creativity, and attention to detail, you'll fit right in.
photo: /images/home/design.jpg
