name: Mechanics
summary: >-
  The builders of the robot. Mechanics work hands-on to assemble and repair all physical
  components, from the chassis to each mechanism. After getting the design from the Design
  team, Mechanics builds the robot's mechanisms and frame. Since everything is built from
  scratch, this is an intensive process of machining, measuring and making sure everything
  fits tolerances. If you enjoy using tools, solving problems on the fly, and getting things
  done, this is the team for you.
order: 1
