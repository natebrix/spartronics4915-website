# Team sponsors, shown on the Sponsors page.
#
# Each sponsor needs an id (lowercase, no spaces), a name and a tier.
# Tiers: pantheon, presenting, gold, silver, bronze, supporting, friends
# (see src/data/sponsorTiers.ts). Within a tier, sponsors appear in this order.
#
# logo is optional. Put the file in src/assets/sponsors/. Logos sit on a blue
# tile, so use a white or light version of the logo.
# link is optional: the sponsor's website.

