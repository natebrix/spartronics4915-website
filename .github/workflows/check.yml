# Runs on every pull request. Cloudflare Pages builds and hosts the site
# separately; this check is what blocks a broken change from merging.
name: Check site

on:
  pull_request:
  push:
    # studio: the editor's pull request is opened by a GitHub Action, which
    # doesn't start pull_request checks, so check each push to it directly.
    branches: [main, studio]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check pages and content
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check internal links and image sizes
        run: npm run check:site
      - name: Check every old WordPress URL still works
        run: npm run check:urls
